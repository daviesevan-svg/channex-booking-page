name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Normal CI installation generates types; the build below runs once.
      - name: Install dependencies
        run: npm ci

      # wrangler types + react-router typegen + tsc -b. Catches undefined names,
      # bad types, and route errors that a plain `tsc` or a successful build miss.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Exercise the same build hook used by Cloudflare's install→upload flow.
      # This is the sole production build in GitHub CI, and also catches
      # client/server bundle breaks and missing generated deployment artifacts.
      - name: Build
        run: node scripts/build-on-workers-ci.mjs
        env:
          WORKERS_CI: "1"

      - name: Check guest bundle
        run: node scripts/check-guest-bundle.mjs

      - name: Check Cloudflare upload artifacts
        run: npx wrangler versions upload --dry-run
